name: CI - Development

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_STAGE: dev
      DB_CONN: ${{ secrets.DEV_DB_CONN }}
      DB_MAX_CONN: ${{ secrets.DEV_DB_MAX_CONN }}
      API_PORT: ${{ secrets.DEV_API_PORT }}
      APP_PAGARME_API: ${{ secrets.DEV_PP_PAGARME_API }}
      STEAM_WEB_API_KEY: ${{ secrets.DEV_STEAM_WEB_API_KEY }}


    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.4

      - name: Build Docker (DEV)
        run: docker build -f build/Dockerfile.dev -t myapp-dev .
