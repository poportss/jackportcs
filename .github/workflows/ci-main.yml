name: CI - Production

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_STAGE: prod
      DB_CONN: ${{ secrets.PROD_DB_CONN }}
      DB_MAX_CONN: ${{ secrets.PROD_DB_MAX_CONN }}
      API_PORT: ${{ secrets.PROD_API_PORT }}

    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.4

      - name: Build Docker (PROD)
        run: docker build -f build/Dockerfile.prod -t myapp-prod .
